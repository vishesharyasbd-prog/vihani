<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: #090909;
    color: #fff;
    font-family: Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 380px;
    text-align: center;
    padding: 38px 24px;
    border: 1px solid rgba(255, 45, 65, 0.25);
    border-radius: 22px;
    background: linear-gradient(
        145deg,
        #171010,
        #0c0c0c 65%
    );
    box-shadow: 0 0 35px rgba(255, 20, 45, 0.13);
}

.logo {
    width: 82px;
    height: 82px;
    margin: 0 auto 22px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 27px;
    font-weight: 800;
    letter-spacing: 1px;
    color: white;
    background: linear-gradient(135deg, #ff304b, #850015);
    border: 2px solid #ff6375;
    box-shadow: 0 0 24px rgba(255, 35, 65, 0.4);
}

h1 {
    font-size: 27px;
    font-weight: 800;
    letter-spacing: 0.5px;
    margin-bottom: 10px;
}

.subtitle {
    color: #aaa;
    font-size: 13px;
    line-height: 1.7;
    margin-bottom: 27px;
}

.status {
    display: inline-block;
    font-size: 11px;
    color: #ff6679;
    background: rgba(255, 35, 65, 0.09);
    border: 1px solid rgba(255, 60, 80, 0.2);
    border-radius: 30px;
    padding: 8px 15px;
    margin-bottom: 24px;
    letter-spacing: 1px;
}

.join-btn {
    display: block;
    width: 100%;
    padding: 16px;
    background: linear-gradient(90deg, #e60027, #ff304b);
    color: white;
    text-decoration: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 0.7px;
    box-shadow: 0 5px 22px rgba(255, 0, 40, 0.28);
    transition: transform 0.2s ease;
}

.join-btn:active {
    transform: scale(0.97);
}

.footer {
    margin-top: 25px;
    color: #666;
    font-size: 10px;
    letter-spacing: 0.5px;
}
</style>
</head>

<body>

<main class="container">

    <div class="logo">VS</div>

    <h1>VIHANI SINGH</h1>

    <p class="subtitle">
        Welcome to the Official Telegram Channel.
        Get the latest cricket updates and match analysis.
    </p>

    <div class="status">
        ● OFFICIAL TELEGRAM CHANNEL
    </div>

    <a
      href="https://t.me/+kCBq3zxj4iY4YzVl"
      class="join-btn"
      id="joinButton"
    >
      JOIN CHANNEL NOW →
    </a>

    <div class="footer">
        © 2026 VIHANI SINGH · ALL RIGHTS RESERVED
    </div>

</main>

<script>
(function () {
    const button = document.getElementById('joinButton');
    let eventFired = false;

    button.addEventListener('click', function(e) {
        if (eventFired) {
            e.preventDefault();
            return;
        }

        eventFired = true;

        if (typeof fbq === 'function') {
            fbq('track', 'Subscribe');
        }
    });
})();
</script>

</body>
</html>
